name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sublimaciones
          POSTGRES_PASSWORD: sublimaciones
          POSTGRES_DB: sublimaciones_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sublimaciones -d sublimaciones_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      APP_ENV: local
      DATABASE_URL: postgresql://sublimaciones:sublimaciones@localhost:5432/sublimaciones_test
      TEST_DATABASE_URL: postgresql://sublimaciones:sublimaciones@localhost:5432/sublimaciones_test
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
